[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "livekit-plugins-moshi"
version = "0.1.0"
description = "LiveKit Agents realtime plugin wrapping a Moshi-protocol server (kyutai-labs/moshi)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "livekit-agents>=1.0",
    "aiohttp>=3.9",
    "numpy>=1.24",
    "sphn>=0.1.4",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["livekit.plugins.moshi", "livekit.plugins.moshi.*"]
